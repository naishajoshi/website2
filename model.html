 <!DOCTYPE html>
 <html lang="en">
   <head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>Ducati | Model Details</title>
     <link rel="stylesheet" href="./styles.css" />
     <style>
       .model-hero { position: relative; min-height: 60vh; display: grid; place-items: center; color: #fff; }
       .model-hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.35)); }
       .model-hero .inner { position: relative; text-align: center; padding: 64px 0; }
       .model-title { font-size: clamp(32px, 6vw, 72px); margin: 0 0 8px; }
       .model-tagline { opacity: .95; max-width: 800px; margin: 0 auto; }
       .model-grid { display: grid; gap: 24px; grid-template-columns: 1fr; padding: 40px 0; }
       @media (min-width: 1024px) { .model-grid { grid-template-columns: 1.2fr 1fr; } }
       .model-media { box-shadow: 0 12px 28px rgba(0,0,0,.12); }
       .model-media img { width: 100%; height: auto; display: block; }
       .specs-panel { background: #fff; box-shadow: 0 12px 28px rgba(0,0,0,.08); padding: 16px; }
       .specs-panel h3 { margin: 0 0 12px; }
       .specs-list { display: grid; gap: 8px; }
       .specs-list div { display: flex; justify-content: space-between; gap: 16px; }
       .specs-list dt { color: var(--muted); }
       .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
       .breadcrumbs { font-size: 14px; margin: 12px 0 0; color: #e5e7eb; }
     </style>
   </head>
   <body>
     <header class="navbar">
       <div class="container nav-inner">
         <a href="./index.html" class="brand" aria-label="Ducati home">
           <img src="./images/ducati_id.png" alt="Ducati" class="brand-logo" />
         </a>
         <nav class="nav-links" aria-label="Primary">
           <a href="./index.html#models">Motorcycles</a>
           <a href="./index.html#motogp">Racing</a>
           <a href="./index.html#dealers">Dealers</a>
           <a href="./index.html#models">Configurator</a>
           <a href="./index.html#test-ride">Experience</a>
         </nav>
         <a href="#" class="btn btn-primary desktop-only">MyDucati</a>
       </div>
     </header>

     <main id="model-root">
       <section class="model-hero" id="model-hero" style="--bg:url('./images/panigale.png'); background: center/cover no-repeat var(--bg)">
         <div class="inner container">
           <h1 class="model-title" id="model-title">Model</h1>
           <p class="model-tagline" id="model-tagline">Performance born to race.</p>
           <div class="breadcrumbs"><a href="./index.html">Home</a> / <a href="./index.html#models">Motorcycles</a> / <span id="model-bc">Model</span></div>
         </div>
       </section>

       <section class="section">
         <div class="container model-grid">
           <div class="model-media"><img id="model-image" src="./images/panigale.png" alt="Model image" /></div>
           <aside class="specs-panel">
             <h3>Key Specifications</h3>
             <dl class="specs-list" id="specs-list">
               <div><dt>Engine</dt><dd>—</dd></div>
               <div><dt>Power</dt><dd>—</dd></div>
               <div><dt>Torque</dt><dd>—</dd></div>
               <div><dt>Dry Weight</dt><dd>—</dd></div>
               <div><dt>Price</dt><dd>—</dd></div>
             </dl>
             <div class="actions">
               <a href="./index.html#test-ride" class="btn btn-primary">Book Test Ride</a>
               <a href="./index.html#dealers" class="btn btn-outline">Find Dealer</a>
             </div>
           </aside>
         </div>
       </section>
     </main>

     <footer class="footer">
       <div class="container">
         <div class="footer-bottom">
           <div class="legal">© 2025 Ducati Motor Holding S.p.A.</div>
           <div class="links"><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Cookies</a></div>
         </div>
       </div>
     </footer>

     <script src="./model.js"></script>
   </body>
 </html>
